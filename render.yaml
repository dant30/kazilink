services:
  - type: web
    name: kazilink-backend
    env: python
    plan: free
    region: ohio
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /api/health/
    buildCommand: bash ./build.sh
    startCommand: cd django && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: POSTGRES_DB
        fromDatabase:
          name: kazilink-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: kazilink-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: kazilink-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: kazilink-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: kazilink-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: kazilink-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://kazilink-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://kazilink-frontend.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MPESA_ENABLED
        value: "true"
      - key: MPESA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://kazilink-backend.onrender.com/api/payments/webhooks/mpesa/
      - key: MPESA_API_TIMEOUT_SECONDS
        value: "15"
      - key: MPESA_STK_MAX_RETRIES
        value: "2"
      - key: MPESA_STK_RETRY_BACKOFF_SECONDS
        value: "3"
      - key: MPESA_WEBHOOK_SECRET
        sync: false
      - key: CREDIT_KSH_PER_CREDIT
        value: "50"
      - key: REFERRAL_REFERRER_CREDITS
        value: "5"
      - key: REFERRAL_REFERRED_CREDITS
        value: "2"
      - key: SMS_ENABLED
        value: "true"
      - key: SMS_API_BASE_URL
        value: https://sms.ots.co.ke/api/v3/
      - key: SMS_API_SEND_PATH
        value: sms/send
      - key: SMS_API_TOKEN
        sync: false
      - key: SMS_SENDER_ID
        sync: false

  - type: web
    name: kazilink-frontend
    env: static
    rootDir: frontend
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kazilink-backend.onrender.com/api
      - key: VITE_APP_ENVIRONMENT
        value: production

  - type: redis
    name: kazilink-redis
    plan: free
    region: ohio
    ipAllowList:
      - source: 0.0.0.0/0

databases:
  - name: kazilink-db
    databaseName: kazilink
    user: kazilink
    plan: free
    region: ohio
