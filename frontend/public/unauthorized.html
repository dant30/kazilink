<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access denied | KaziLink</title>
    <meta
      name="description"
      content="You do not have permission to access this page."
    />
    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(15, 23, 42, 0.92);
        --panel-border: rgba(148, 163, 184, 0.24);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #ff6b00;
        --accent-soft: rgba(255, 107, 0, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #0b1020 0%, #161d2d 58%, #1d2438 100%);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .card {
        width: min(100%, 560px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 25px 55px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: var(--accent-soft);
        color: #ffb38a;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 2.75rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto 24px;
        max-width: 44ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        padding: 12px 20px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.16s ease, filter 0.16s ease;
      }

      .button.secondary {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: var(--text);
      }

      .button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="card" role="alert" aria-live="polite">
      <div class="badge">403</div>
      <h1>Access denied</h1>
      <p>
        You do not have permission to view this page. Please sign in with the correct account
        or return to the dashboard.
      </p>
      <div class="actions">
        <a class="button" href="/">Go to home</a>
        <button class="button secondary" type="button" onclick="window.history.back()">
          Go back
        </button>
      </div>
    </main>
  </body>
</html>
